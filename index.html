<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vokabeltest</title>
<style>
:root{
  --paper:#FBF9F4; --paper-2:#F1EEE6; --ink:#1B2A4A; --ink-2:#4F5B75; --rule:#D8D3C6; --line:#AEB8CE;
  --ok:#2E7D4F; --near:#A9700F; --bad:#B3261E; --focus:#2F6FED;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:22px 20px 90px}
h1{font-size:2rem;line-height:1.15;margin:0 0 .3rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.3rem;line-height:1.25;margin:2.2rem 0 .7rem}
h3{font-size:1.05rem;margin:1.4rem 0 .3rem}
p{margin:.4rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
a{color:var(--ink)}
label.f{display:block;margin:1.1rem 0 .3rem;font-weight:700}
label.f .muted{font-weight:400}
input[type=text],input[type=number],input[type=url],textarea,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:#fff;border:1.5px solid var(--rule);border-radius:6px;padding:.6rem .7rem;margin:0}
input[type=file]{font:inherit;font-size:.95rem;max-width:100%}
textarea{min-height:190px;line-height:1.45;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem}
textarea.short{min-height:72px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:.7rem 1.1rem;cursor:pointer;min-height:46px}
.btn.sec{background:transparent;color:var(--ink)}
.btn.sm{padding:.4rem .75rem;min-height:38px;font-size:.9rem}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.8rem 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.opt{display:flex;gap:.6rem;align-items:flex-start;margin:.5rem 0}
.opt input{width:20px;height:20px;margin:3px 0 0;flex:none}
.card{background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:1rem 1.1rem 1.2rem;margin:1rem 0}
.notice{border-left:4px solid var(--near);background:#FFF7E4;padding:.6rem .9rem;border-radius:0 6px 6px 0;margin:.8rem 0}
.notice.err{border-left-color:var(--bad);background:#FBEDEB}
.notice.good{border-left-color:var(--ok);background:#EAF5EE}
.notice.info{border-left-color:var(--line);background:var(--paper-2)}
.linkbox{display:flex;gap:.5rem;align-items:center}
.linkbox input{flex:1;font-size:.9rem}
#qr{margin:.6rem 0 .2rem;display:inline-block;padding:10px;background:#fff;border:1px solid var(--rule)}
#qr:empty{display:none}
ul.tests{list-style:none;padding:0;margin:0}
ul.tests li{padding:.7rem 0;border-bottom:1px solid var(--rule)}
ul.tests li .row{margin:.35rem 0 0}
pre{background:var(--paper-2);border-radius:8px;padding:.8rem;overflow:auto;font-size:.78rem;line-height:1.45;max-height:340px}
code{background:var(--paper-2);padding:.05rem .35rem;border-radius:4px;font-size:.92em}
details{border-top:1px solid var(--rule);padding:.2rem 0}
details summary{cursor:pointer;font-weight:700;padding:.5rem 0}
details.more{border:1.5px solid var(--rule);border-radius:10px;padding:.2rem 1rem;margin:1.4rem 0}
table.t{width:100%;border-collapse:collapse;margin:.5rem 0;font-size:.95rem}
table.t th,table.t td{text-align:left;padding:.35rem .4rem;border-bottom:1px solid var(--rule);vertical-align:top}
table.t th{font-weight:700}
table.mini{width:auto;margin:.5rem 0 .2rem}
.tablewrap{overflow-x:auto}
/* Testbogen */
.timer{position:sticky;top:0;background:var(--paper);padding:.55rem 0;border-bottom:1px solid var(--rule);z-index:5;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.sheet{margin:1rem 0 0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:2.3rem 1fr;gap:.15rem .6rem;align-items:baseline;padding:.85rem 0;border-bottom:1px solid var(--rule)}
.item .no{color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.item .q{font-size:1.2rem;font-weight:700}
.item .q .hint{font-weight:400;color:var(--ink-2);font-size:.9rem;margin-left:.5rem}
.item .ans{grid-column:2}
.ans input{width:100%;font:inherit;font-size:1.2rem;padding:.45rem .2rem;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;color:var(--ink);margin:0}
.ans input:focus-visible{outline:none;border-bottom-color:var(--focus)}
.res{display:grid;grid-template-columns:1.5rem 1fr;gap:.2rem .5rem;padding:.55rem 0;border-bottom:1px solid var(--rule)}
.s-ok{color:var(--ok)} .s-near{color:var(--near)} .s-bad{color:var(--bad)}
.big{font-size:2.8rem;font-weight:700;line-height:1.1;margin:.5rem 0}
.stick{position:sticky;bottom:0;background:var(--paper);padding:.8rem 0 .2rem;border-top:1px solid var(--rule);margin-top:1rem}
.overlay{position:fixed;inset:0;background:rgba(27,42,74,.6);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.overlay .card{max-width:420px;margin:0}
/* Live-Auswertung */
.count{font-size:3.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin:.3rem 0}
.bar{height:14px;background:var(--paper-2);border-radius:8px;overflow:hidden;margin:.5rem 0 1rem;border:1px solid var(--rule)}
.bar > span{display:block;height:100%;background:var(--ok);transition:width .4s ease}
.grid{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.cell{min-width:3.6rem;text-align:center;padding:.4rem .3rem;border:1.5px solid var(--rule);border-radius:8px;background:#fff;font-variant-numeric:tabular-nums;font-size:.95rem}
.cell b{display:block;font-size:1rem}
.cell.in{border-color:var(--ok);background:#EAF5EE}
.cell.out{color:var(--ink-2);background:var(--paper-2)}
.cell.flag{border-color:var(--near);background:#FFF7E4}
.cell.dup{border-color:var(--bad);background:#FBEDEB}
.dist{display:grid;grid-template-columns:5.5rem 1fr 2.2rem;gap:.3rem .5rem;align-items:center;font-variant-numeric:tabular-nums;font-size:.95rem}
.dist .db{height:12px;background:var(--ink);border-radius:6px;min-width:2px}
#printarea{display:none}
@media print{
  body{background:#fff} .noprint{display:none!important}
  body.print-report > .wrap{display:none}
  body.print-report #printarea{display:block;max-width:none;padding:0}
  #printarea h1{font-size:1.5rem;margin:0 0 .2rem}
  #printarea h3{margin:1rem 0 .2rem}
  #printarea table{width:100%;border-collapse:collapse;font-size:10pt}
  #printarea th,#printarea td{border-bottom:1px solid #999;padding:3px 4px;text-align:left;vertical-align:top}
  #printarea tr{page-break-inside:avoid}
  #printarea .dist{display:grid;grid-template-columns:9rem 1fr 2.5rem;gap:2px 6px;align-items:center;font-size:10pt}
  #printarea .db{height:8px;background:#333;border-radius:4px;display:block}
  #printarea .paper{page-break-before:always}
  #printarea .paper h3{margin:0 0 .2rem;font-size:1.2rem}
  #printarea .paper .meta{margin:0 0 .4rem;font-size:10pt}
  #printarea .mark{text-align:center;font-weight:700;width:2em}
  #printarea .miss{font-style:italic}
  body.print-key .wrap>*:not(#result){display:none} body.print-key #result>*:not(#key){display:none}
  #result{border:0;padding:0}
}
</style>
</head>
<body>
<main id="app" class="wrap"></main>
<script>
(function () {
'use strict';

/* ===== Konfiguration =====
 * DEFAULT_ENDPOINT bleibt leer: Diese Datei liegt öffentlich auf GitHub, ein fest eingetragener
 * Endpunkt wäre für jeden im Internet beschreibbar. Jede Lehrkraft trägt ihre eigene URL ein. */
var DEFAULT_ENDPOINT = '';
var QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
var POLL_MS = 10000;

var LS = { ep: 'vt_endpoint', tests: 'vt_tests', teacher: 'vt_teacher', results: 'vt_results' };
var APP = null;
var timer = null;
var poll = null;
var swapCols = false;
var wakeLock = null;

var EXAMPLE = 'house – das Haus\ncolour/color – die Farbe\nto look forward to sth. – sich auf etw. freuen\nbig/large – groß\nbank (money) – die Bank';
var AI_PROMPT = 'Auf dem Bild siehst du eine Vokabelseite aus unserem Englischbuch (Chapter 3.1). Erstelle daraus eine Vokabelliste für einen Test.\n\n' +
  'Regeln für das Format, bitte genau einhalten:\n' +
  '- Pro Zeile ein Wortpaar: erst Englisch, dann „ – “ (Leerzeichen, Gedankenstrich, Leerzeichen), dann Deutsch.\n' +
  '- Keine Nummerierung, keine Überschriften, keine Erklärungen, keine Leerzeilen. Nur die Liste als reiner Text, ohne Tabelle und ohne Markdown.\n' +
  '- Englische Verben mit „to“ (to look forward to sth.), deutsche Nomen mit Artikel (die Farbe).\n' +
  '- Alternative Lösungen ausschließlich mit Schrägstrich trennen: colour/color – die Farbe; big/large – groß/riesig.\n' +
  '- Kommas innerhalb einer Übersetzung ganz normal verwenden (sich freuen, dass …). Ein Komma ist kein Trenner für Alternativen.\n' +
  '- Zusätze, die nur der Einordnung dienen, in Klammern: bank (money) – die Bank.\n' +
  '- Reihenfolge wie im Buch. Beispielsätze, Lautschrift und Wortarten weglassen.\n' +
  '- Erfinde keine Einträge und ergänze keine Vokabeln, die nicht auf dem Bild stehen. Kannst du ein Wort nicht sicher lesen, schreibe dahinter (?), ich prüfe die Liste.\n\n' +
  'So sollen zwei Zeilen aussehen:\n' +
  'to look forward to sth. – sich auf etw. freuen\n' +
  'colour/color – die Farbe';
var IDM = {
  nr:   { name: 'Listennummer', teacher: 'Nummer in der Klassenliste', student: 'Deine Nummer in der Klassenliste', example: '', re: /^[1-9]\d?$/, err: 'Bitte deine Nummer aus der Klassenliste eingeben (1 bis 99).', len: 2, upper: false },
  libe: { name: 'Zwei-Buchstaben-Kürzel', teacher: 'Zwei Buchstaben aus Vor- und Nachname (Lisa Berger → LIBE)', student: 'Dein Kürzel', example: 'die ersten zwei Buchstaben von Vorname und Nachname, z. B. LIBE für Lisa Berger', re: /^[A-Za-zÄÖÜäöüß]{4}$/, err: 'Bitte genau vier Buchstaben eingeben: zwei vom Vornamen, zwei vom Nachnamen.', len: 4, upper: true },
  ini:  { name: 'Initialen', teacher: 'Initialen (Lisa Berger → LB)', student: 'Deine Initialen', example: 'z. B. LB für Lisa Berger', re: /^[A-Za-zÄÖÜäöüß]{2,4}$/, err: 'Bitte deine Initialen eingeben (2 bis 4 Buchstaben).', len: 4, upper: true }
};

/* ===== Hilfsfunktionen ===== */
function $(s, root) { return (root || document).querySelector(s); }
function $$(s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function b64uEncode(str) {
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64uDecode(s) {
  s = String(s).replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function uid(n) {
  var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '', r = new Uint8Array(n || 6);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(r); else for (var j = 0; j < r.length; j++) r[j] = Math.floor(Math.random() * 256);
  for (var i = 0; i < r.length; i++) s += a.charAt(r[i] % a.length);
  return s;
}
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pts(n) { return String(Math.round(n * 2) / 2).replace('.', ','); }
function pct(n) { return String(n).replace('.', ','); }
function fmtTime(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
function fmtDate(iso) { try { return new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); } catch (e) { return ''; } }
function fmtClock(iso) { try { return new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function ssGet(k) { try { var v = sessionStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
function baseUrl() { return location.origin + location.pathname; }
function dirLabel(d) { return d === 'de2en' ? 'Deutsch → Englisch' : d === 'mix' ? 'gemischte Richtung' : 'Englisch → Deutsch'; }
function idmOf(t) { return IDM[t.idm] ? t.idm : 'nr'; }
function pad2(n) { return (Number(n) < 10 ? '0' : '') + n; }
function safeCell(v) { return typeof v === 'string' && /^[=+\-@\t\r]/.test(v) ? "'" + v : v; }
/* Notenschlüssel: 12 Punkte = Bezugsgröße, bei mehr oder weniger Vokabeln hochgerechnet.
   12–11 sehr gut · 10–9 gut · 8–7 befriedigend · 6–5 ausreichend · 4–1 mangelhaft · 0 ungenügend */
var GRADES = [{ n: 1, name: 'sehr gut', min: 11 }, { n: 2, name: 'gut', min: 9 }, { n: 3, name: 'befriedigend', min: 7 },
  { n: 4, name: 'ausreichend', min: 5 }, { n: 5, name: 'mangelhaft', min: 0.000001 }, { n: 6, name: 'ungenügend', min: 0 }];
function gradeOf(score, max) {
  var s = max > 0 ? score / max * 12 : 0;
  for (var i = 0; i < GRADES.length; i++) if (s >= GRADES[i].min - 1e-9) return GRADES[i];
  return GRADES[GRADES.length - 1];
}
function gradeText(score, max) { var g = gradeOf(score, max); return g.name + ' (' + g.n + ')'; }
function gradeTable() {
  return '<h3>Notenschlüssel</h3><p class="small">Bezugsgröße 12 Punkte, bei anderer Vokabelzahl anteilig umgerechnet: ' +
    '12–11 sehr gut · 10–9 gut · 8–7 befriedigend · 6–5 ausreichend · 4–1 mangelhaft · 0 ungenügend.</p>';
}
/* Sortierung: nach Nachname. LIBE = 2 Buchstaben Vorname + 2 Nachname, also ab Stelle 3;
   Initialen: ab dem zweiten Buchstaben; Listennummern folgen der Klassenliste. */
function guessIdm(k) { var s = String(k || ''); return /^\d+$/.test(s) ? 'nr' : s.length === 4 ? 'libe' : 'ini'; }
function sortName(k, idm) {
  var s = String(k || '').toUpperCase();
  if (idm === 'ini') return s.slice(1) + ' ' + s.slice(0, 1);
  return s.slice(2) + ' ' + s.slice(0, 2);
}
function cmpKennung(a, b, idm) {
  if (idm === 'nr') return (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0) || String(a).localeCompare(String(b), 'de');
  return sortName(a, idm).localeCompare(sortName(b, idm), 'de');
}
function sortRows(rows, idm) {
  return rows.slice().sort(function (a, b) {
    return cmpKennung(a.kennung, b.kennung, idm) || String(a.submittedAt).localeCompare(String(b.submittedAt));
  });
}
/* Korrigierter Bogen je Person – nur im PDF, eine Seite pro Person */
function studentSheets(rows, title) {
  return rows.map(function (r) {
    var items = r.items.slice().sort(function (a, b) { return a.id - b.id; });
    var wrong = items.filter(function (it) { return it.s !== 'ok'; }).length;
    return '<div class="paper"><h3>' + esc(r.kennung) + (r.late ? ' (verspätet)' : '') + '</h3>' +
      '<p class="meta">' + esc(title) + ' · ' + pts(r.score) + ' von ' + r.max + ' Punkten · ' + esc(gradeText(r.score, r.max)) +
      ' · ' + wrong + (wrong === 1 ? ' Fehler' : ' Fehler') + (r.leftCount || r.leftText ? ' · Seite verlassen: ' + esc(r.leftCount ? r.leftCount + '×' : r.leftText) : '') + '</p>' +
      '<table><tr><th>Nr.</th><th>Vokabel</th><th>Antwort</th><th class="mark">&nbsp;</th><th>Lösung</th></tr>' +
      items.map(function (it) {
        var sym = it.s === 'ok' ? '✓' : it.s === 'near' ? '≈' : '✗';
        return '<tr><td>' + pad2(it.id) + '</td><td>' + esc(it.q) + '</td>' +
          '<td' + (it.s === 'empty' ? ' class="miss"' : '') + '>' + (it.a ? esc(it.a) : '—') + '</td>' +
          '<td class="mark">' + sym + '</td><td>' + (it.s === 'ok' ? '' : esc(it.key || '')) + '</td></tr>';
      }).join('') + '</table></div>';
  }).join('');
}
function printReport(title, html) {
  var area = document.getElementById('printarea');
  if (!area) { area = document.createElement('div'); area.id = 'printarea'; document.body.appendChild(area); }
  area.innerHTML = '<h1>' + esc(title) + '</h1><p class="small muted">Stand: ' + new Date().toLocaleString('de-DE') + '</p>' + html;
  document.body.classList.add('print-report');
  window.print();
  setTimeout(function () { document.body.classList.remove('print-report'); area.innerHTML = ''; }, 1000);
}
function median(a) { if (!a.length) return 0; var s = a.slice().sort(function (x, y) { return x - y; }), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) * 5) / 10; }
function withTimeout(p, ms) {
  return new Promise(function (res, rej) {
    var t = setTimeout(function () { rej(new Error('Keine Antwort vom Server (Zeitüberschreitung)')); }, ms);
    p.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); });
  });
}
function apiPost(ep, payload) {
  return withTimeout(fetch(ep, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'Server meldet einen Fehler'); return j; }), 25000);
}
function apiGet(ep, params) {
  var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  return withTimeout(fetch(ep + (ep.indexOf('?') >= 0 ? '&' : '?') + q).then(function (r) { return r.json(); })
    .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'Server meldet einen Fehler'); return j; }), 25000);
}
function apiRetry(ep, payload, tries) {
  return apiPost(ep, payload).catch(function (e) {
    if (tries <= 0) throw e;
    return new Promise(function (res) { setTimeout(res, 800 + Math.random() * 1500); }).then(function () { return apiRetry(ep, payload, tries - 1); });
  });
}
function copyText(t, btn) {
  function done() { if (btn) { var o = btn.textContent; btn.textContent = 'Kopiert'; setTimeout(function () { btn.textContent = o; }, 1500); } }
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    try { document.execCommand('copy'); done(); } catch (e) { window.prompt('Zum Kopieren markieren:', t); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}
function keepAwake() {
  try { if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }, function () {}); } catch (e) {}
}
function stopPoll() { if (poll) { clearInterval(poll); poll = null; } }

/* ===== Liste einlesen ===== */
var SEPS = [' – ', ' — ', ' - ', ' = ', ';', '|'];
function parseList(text, firstCol) {
  var items = [], bad = [], unsure = [];
  String(text || '').split(/\r?\n/).forEach(function (raw, idx) {
    var line = raw.trim();
    if (!line || line.charAt(0) === '#') return;
    line = line.replace(/^\d+[.)]\s*/, '');
    var a = null, b = null;
    if (line.indexOf('\t') >= 0) {
      var k = line.indexOf('\t'); a = line.slice(0, k); b = line.slice(k + 1);
    } else {
      var pos = -1, sep = null;
      SEPS.forEach(function (s) { var p = line.indexOf(s); if (p > 0 && (pos < 0 || p < pos)) { pos = p; sep = s; } });
      if (sep) { a = line.slice(0, pos); b = line.slice(pos + sep.length); }
    }
    if (a == null) { bad.push(idx + 1); return; }
    a = a.replace(/\t/g, ' ').trim(); b = b.replace(/\t/g, ' ').trim();

var ARTICLES = /^(the|a|an|der|die|das|ein|eine|einen|einem|einer|eines|dem|den|des)\s+/i;
var PLACEHOLDERS = /\b(sth|sb|etw|jdn|jdm|jds|oneself)\.?(?=\s|$)/gi;
function norm(s, o) {
  var t = String(s == null ? '' : s).trim();
  t = t.replace(/[\u2019\u2018`\u00B4]/g, "'").replace(/[\u2013\u2014]/g, '-').replace(/\s*\([^)]*\)\s*/g, ' ');
  if (o.ignoreCase) t = t.toLowerCase();
  if (o.lenient) { t = t.replace(PLACEHOLDERS, ' ').replace(/\s+/g, ' ').trim(); t = t.replace(ARTICLES, ''); }
  if (o.ignoreTo) t = t.replace(/^to\s+/i, '');
  t = t.replace(/[.!?]+$/, '').replace(/\s+/g, ' ').trim();
  return t;
}
function noTo(t) { return t.replace(/^to\s+/i, ''); }
function lev(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  var prev = [], cur, i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur = [i];
    for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
    prev = cur;

}

function gradeItem(given, key, o) {
  var alts = String(key).split(ALT).map(function (x) { return norm(x, o); }).filter(Boolean);
  var parts = String(given == null ? '' : given).split(ALT).map(function (x) { return norm(x, o); }).filter(Boolean);
  if (!parts.length) return { s: 'empty', p: 0 };
  var near = false;
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    if (alts.indexOf(p) >= 0) continue;
    var nm = alts.some(function (a) { return noTo(a) === noTo(p) || (a.length >= 4 && p.length >= 4 && lev(p, a) === 1); });
    if (nm) { near = true; continue; }

}

function gradeSubmission(test, answers) {
  var byId = {}; (test.items || []).forEach(function (it) { byId[it.id] = it; });
  var opts = test.opts || { ignoreCase: true }, items = [], score = 0;
  (answers || []).forEach(function (an) {
    var src = byId[an && an.id]; if (!src) return;
    var q = src.d === 'de2en' ? src.de : src.en, key = src.d === 'de2en' ? src.en : src.de;
    var g = gradeItem(an.a, key, opts);
    items.push({ id: src.id, q: q, key: key, a: String(an.a == null ? '' : an.a).trim(), s: g.s, p: g.p });
    score += g.p;

  items.sort(function (a, b) { return a.id - b.id; });

}

var GS_CODE = String.raw`/**
 * Vokabeltest – Datenspeicher und Live-Auswertung (Google Apps Script)

function doGet(e) {

    if (p.code) return getTest(String(p.code));
    if (p.results) return getResults(String(p.results), String(p.token || ''), p.full === '1');
    return out({ ok: true, service: 'vokabeltest' });
  } catch (err) { return out({ ok: false, error: String(err) }); }
}

function doPost(e) {
  var d;
  try { d = JSON.parse(e.postData.contents); } catch (err) { return out({ ok: false, error: 'Ungültige Daten' }); }
  if (!d || typeof d !== 'object') return out({ ok: false, error: 'Ungültige Daten' });
  try {
    if (d.action === 'ping') return out({ ok: true });
    if (d.action === 'store') return storeTest(d);
    if (d.action === 'result') return storeResult(d);
    if (d.action === 'close') return closeTest(d);
    return out({ ok: false, error: 'Unbekannte Aktion' });
  } catch (err) { return out({ ok: false, error: String(err) }); }
}

/* --- Tests --- */
function storeTest(d) {
  var t = cleanTest(d.test);
  if (!t) return out({ ok: false, error: 'Test unvollständig oder zu groß' });
  var token = String(d.token || '');
  if (!/^[A-Z0-9]{10,40}$/.test(token)) return out({ ok: false, error: 'Ungültiges Lehrer-Kennwort' });
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(30000);
    var sh = sheet('Tests', T_HEAD);
    var rows = allRows(sh), code;
    var used = {}; rows.forEach(function (r) { used[String(r[1])] = 1; });
    do { code = ''; for (var i = 0; i < 6; i++) code += ALPHABET.charAt(Math.floor(Math.random() * ALPHABET.length)); } while (used[code]);
    sh.appendRow([t.id, code, new Date(), safeCell(t.title), safeCell(t.teacher), 'open', token, JSON.stringify(t)]);
    return out({ ok: true, code: code });
  } catch (err) { return out({ ok: false, error: String(err) });
  } finally { if (lock.hasLock()) lock.releaseLock(); }
}

function findTest(col, value) {
  var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Tests');
  if (!sh || sh.getLastRow() < 2) return null;
  var rows = sh.getRange(2, 1, sh.getLastRow() - 1, T_HEAD.length).getValues();
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i][col]).toUpperCase() === String(value).toUpperCase()) return { row: i + 2, v: rows[i], test: JSON.parse(rows[i][7]) };

}

function getTest(code) {

function closeTest(d) {

    lock.waitLock(30000);

    return out({ ok: true, status: d.open ? 'open' : 'closed' });

/* --- Ergebnisse --- */
function storeResult(d) {

  if (!Array.isArray(d.answers) || d.answers.length > test.items.length) return out({ ok: false, error: 'Antworten passen nicht zum Test' });

function cleanTest(t) {

  if (!confirm('Test wirklich beenden?\n\nDanach werden neue Abgaben als verspätet gekennzeichnet. Bereits eingegangene Ergebnisse bleiben erhalten.')) return;
  var btn = $('#live-close'); btn.disabled = true; btn.textContent = 'Wird beendet …';
  apiPost(LIVE.ep, { action: 'close', testId: LIVE.testId, token: LIVE.token }).then(function () { LIVE.full = true; stopPoll(); fetchLive(); })
    .catch(function (e) { btn.disabled = false; btn.textContent = 'Test beenden'; alert('Das hat nicht geklappt: ' + e.message); });
}

/* ===== Auswertung ohne Google (Import) ===== */
var STATUS = ['ok', 'near', 'wrong', 'empty'];
function validResult(o) {
  if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
  if (typeof o.testId !== 'string' || !/^[A-Z0-9]{4,12}$/.test(o.testId)) return null;
  if (typeof o.kennung !== 'string' || !o.kennung || o.kennung.length > 12) return null;
  if (typeof o.score !== 'number' || typeof o.max !== 'number' || !Array.isArray(o.items) || o.items.length > 300) return null;
  var items = [];
  for (var i = 0; i < o.items.length; i++) {
    var it = o.items[i];
    if (!it || typeof it.id !== 'number' || typeof it.q !== 'string' || STATUS.indexOf(it.s) < 0) return null;
    items.push({ id: it.id, q: it.q.substring(0, 200), key: typeof it.key === 'string' ? it.key.substring(0, 200) : '', a: typeof it.a === 'string' ? it.a.substring(0, 200) : '', s: it.s, p: it.s === 'ok' ? 1 : (it.s === 'near' && it.p === 0.5 ? 0.5 : 0) });
  }
  var score = items.reduce(function (s, it) { return s + it.p; }, 0), max = items.length || 1;
  return {
    testId: o.testId, submissionId: typeof o.submissionId === 'string' ? o.submissionId.substring(0, 32) : '',
    title: typeof o.title === 'string' ? o.title.substring(0, 120) : o.testId, kennung: o.kennung,
    submittedAt: typeof o.submittedAt === 'string' ? o.submittedAt.substring(0, 40) : '',
    durationSec: Math.max(0, Math.round(Number(o.durationSec) || 0)), score: score, max: max, percent: Math.round(score / max * 1000) / 10,
    wrongText: typeof o.wrongText === 'string' ? o.wrongText.substring(0, 4000) : '',
    leftText: typeof o.leftText === 'string' ? o.leftText.substring(0, 500) : '', auto: o.auto === 'time' ? 'time' : '', items: items
  };
}
function extractResults(text) {
  var out = [];
  function add(o) { var v = validResult(o); if (v) out.push(v); }
  text = String(text || '').trim();
  if (text.length > 5000000) return out;
  try { var j = JSON.parse(text); if (Array.isArray(j)) j.slice(0, 500).forEach(add); else add(j); return out; } catch (e) {}
  var m, re = /VT1:([A-Za-z0-9_-]{20,})/g;
  while ((m = re.exec(text))) { try { add(JSON.parse(b64uDecode(m[1]))); } catch (e) {} }
  return out;
}
function importResults(list) {
  var store = lsGet(LS.results, []), added = 0, dup = 0;
  list.forEach(function (r) {
    var key = r.submissionId ? r.testId + '|' + r.submissionId : r.testId + '|' + r.kennung + '|' + r.submittedAt;
    if (store.some(function (s) { return (s.submissionId ? s.testId + '|' + s.submissionId : s.testId + '|' + s.kennung + '|' + s.submittedAt) === key; })) { dup++; return; }
    store.push(r); added++;
  });
  return { added: added, dup: dup, saved: lsSet(LS.results, store) };
}
function importStatus(s, note) {
  var text = s.added + ' Ergebnis' + (s.added === 1 ? '' : 'se') + ' eingelesen' + (s.dup ? ', ' + s.dup + ' bereits vorhanden' : '') + (note || '') + '.';
  if (!s.saved) text += ' Achtung: konnte in diesem Browser nicht gespeichert werden (Speicher voll?). Bitte jetzt als PDF speichern oder alte Ergebnisse löschen.';
  setStatus('#a-status', text, s.added && s.saved ? 's-ok' : 's-bad');
}
function renderAnalysis() {
  APP.innerHTML =
    '<header><p class="small"><a href="#">← Zurück zum Editor</a></p><h1>Auswertung ohne Google</h1>' +
    '<p class="muted">Für Ergebnisse, die dir Lernende per AirDrop, Mail oder Teams geschickt haben. Mit eingerichteter Tabelle brauchst du diese Seite nicht – dort nutzt du die Live-Auswertung.</p></header>' +
    '<section class="card">' +
    '<label class="f" for="a-files">Empfangene Dateien einlesen <span class="muted">(mehrere auf einmal möglich)</span></label><input type="file" id="a-files" multiple accept=".txt,.json,text/plain,application/json">' +
    '<label class="f" for="a-text">Oder Text einfügen</label><textarea id="a-text" class="short" placeholder="VT1:…"></textarea>' +
    '<div class="row"><button class="btn sm" id="a-import">Text einlesen</button><span id="a-status" class="small"></span></div>' +
    '</section>' +
    '<section><label class="f" for="a-test">Test</label><select id="a-test"></select><div id="a-out"></div></section>' +
    '<section><h2>Lokale Daten</h2><p class="small muted">Alles, was dieses Tool speichert, liegt nur in diesem Browser.</p>' +
    '<div class="row"><button class="btn sec sm" id="a-del-results">Alle Ergebnisse löschen</button><button class="btn sec sm" id="a-del-tests">Alle Tests löschen</button><button class="btn sec sm" id="a-del-all">Alles löschen</button></div></section>';
  $('#a-files').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []), all = [];
    Promise.all(files.map(function (f) { return f.text().then(function (t) { all = all.concat(extractResults(t)); }); }))
      .then(function () { importStatus(importResults(all), files.length && !all.length ? ' – in den Dateien wurde kein gültiges Ergebnis gefunden' : ''); e.target.value = ''; renderAnalysisTable(); });
  });
  $('#a-import').addEventListener('click', function () {
    var list = extractResults($('#a-text').value), s = importResults(list);
    importStatus(s, !list.length ? ' – kein gültiges Ergebnis im Text gefunden' : '');
    if (s.added) $('#a-text').value = '';
    renderAnalysisTable();
  });
  $('#a-test').addEventListener('change', renderAnalysisTable);
  $('#a-del-results').addEventListener('click', function () { if (confirm('Alle eingelesenen Ergebnisse löschen?')) { lsSet(LS.results, []); renderAnalysisTable(); } });
  $('#a-del-tests').addEventListener('click', function () { if (confirm('Alle gespeicherten Tests aus diesem Browser löschen? Damit verlierst du auch den Zugang zur Live-Auswertung dieser Tests.')) { lsSet(LS.tests, []); renderAnalysisTable(); } });
  $('#a-del-all').addEventListener('click', function () { if (confirm('Wirklich alle lokalen Daten löschen (Tests, Ergebnisse, Einstellungen)?')) { try { localStorage.clear(); } catch (e) {} renderAnalysisTable(); } });
  renderAnalysisTable();
}
function renderAnalysisTable() {
  var store = lsGet(LS.results, []), sel = $('#a-test'), out = $('#a-out'), current = sel.value;
  var byTest = {};
  store.forEach(function (r) { (byTest[r.testId] = byTest[r.testId] || { id: r.testId, title: r.title, rows: [] }).rows.push(r); });
  var ids = Object.keys(byTest);
  if (!ids.length) { sel.innerHTML = '<option value="">noch keine Ergebnisse</option>'; out.innerHTML = '<p class="muted">Sobald Ergebnisse eingelesen sind, erscheint hier die Tabelle.</p>'; return; }
  sel.innerHTML = ids.map(function (id) { return '<option value="' + esc(id) + '">' + esc(byTest[id].title) + ' (' + byTest[id].rows.length + ')</option>'; }).join('');
  if (byTest[current]) sel.value = current;
  var entry = lsGet(LS.tests, []).filter(function (t) { return t.id === g.id; })[0];
  var idm = entry ? idmOf(entry.test) : guessIdm(g.rows.length ? g.rows[0].kennung : '');
  var rows = sortRows(g.rows, idm);
  var roster = entry ? (entry.roster || []) : [];
  var perK = {}; rows.forEach(function (r) { perK[r.kennung] = (perK[r.kennung] || 0) + 1; });
  var people = Object.keys(perK), dupes = people.filter(function (k) { return perK[k] > 1; }), missing = roster.filter(function (k) { return !perK[k]; });
  var total = rows.length, miss = {}, seen = {}, label = {}, idsSeen = [];
  rows.forEach(function (r) { r.items.forEach(function (it) { if (idsSeen.indexOf(it.id) < 0) idsSeen.push(it.id); seen[it.id] = (seen[it.id] || 0) + 1; label[it.id] = it.q; if (it.s !== 'ok') miss[it.id] = (miss[it.id] || 0) + 1; }); });
  idsSeen.sort(function (a, b) { return a - b; });
  var hardest = Object.keys(miss).sort(function (a, b) { return miss[b] - miss[a]; });
  var maxPoints = rows.length ? rows[0].max : 0;
  var scores = rows.map(function (r) { return r.score; }), grades = rows.map(function (r) { return gradeOf(r.score, r.max).n; });
  var avgScore = scores.length ? Math.round(scores.reduce(function (s, p) { return s + p; }, 0) / scores.length * 10) / 10 : 0;
  var avgGrade = grades.length ? Math.round(grades.reduce(function (s, p) { return s + p; }, 0) / grades.length * 10) / 10 : 0;
  var summary = '<p class="small muted">' + total + ' Abgabe' + (total === 1 ? '' : 'n') + ' von ' + people.length + ' Person' + (people.length === 1 ? '' : 'en') +
    ', Durchschnitt ' + pts(avgScore) + ' von ' + maxPoints + ' Punkten, Notendurchschnitt ' + pct(avgGrade) + ', Median ' + pct(median(grades)) + '.' +
    (roster.length ? ' Fehlend: ' + (missing.length ? esc(missing.join(', ')) : 'niemand') + '.' : '') + '</p>';
  var singles = '<h3>Einzelergebnisse</h3><div class="tablewrap">' + rowsTable(rows, perK) + '</div>';
  var flags = dupes.length ? '<h3>Auffällig</h3><ul class="small">' + dupes.map(function (k) { return '<li>' + esc(k) + ' – ' + perK[k] + ' Abgaben</li>'; }).join('') +
    rows.filter(function (r) { return r.leftText; }).map(function (r) { return '<li>' + esc(r.kennung) + ' – ' + esc(r.leftText) + '</li>'; }).join('') + '</ul>'
    : (rows.some(function (r) { return r.leftText; }) ? '<h3>Auffällig</h3><ul class="small">' + rows.filter(function (r) { return r.leftText; }).map(function (r) { return '<li>' + esc(r.kennung) + ' – ' + esc(r.leftText) + '</li>'; }).join('') + '</ul>' : '');
  var distHtml = gradeDist(grades), hardHtml = hardestTable(hardest, miss, seen, label);
  out.innerHTML = summary + singles + flags + distHtml + hardHtml +
    '<div class="row" style="margin-top:1.2rem"><button class="btn sec sm" id="a-pdf">Als PDF speichern</button><button class="btn sec sm" id="a-copy">Tabelle kopieren (für Excel)</button><button class="btn sec sm" id="a-del">Ergebnisse dieses Tests löschen</button></div>';
  function tableText(sep) {
    var head = ['Kennung', 'Punkte', 'Max', 'Note', 'Dauer (s)', 'Abgabe', 'Seite verlassen', 'Fehler'].concat(idsSeen.map(function (id) { return pad2(id) + ' ' + label[id]; }));
    var lines = [head.map(function (c) { return q(c, sep); }).join(sep)];
    rows.forEach(function (r) {
      var m = {}; r.items.forEach(function (it) { m[it.id] = cellOf(it); });
      lines.push([r.kennung, pts(r.score), r.max, gradeText(r.score, r.max), r.durationSec, r.auto === 'time' ? 'automatisch (Zeit)' : 'selbst', r.leftText || '', r.wrongText || '']
        .concat(idsSeen.map(function (id) { return m[id] || ''; })).map(function (c) { return q(c, sep); }).join(sep));
    });
    return lines.join('\n');
  }
  function q(c, sep) { c = String(safeCell(c == null ? '' : String(c))); return sep === ';' ? '"' + c.replace(/"/g, '""') + '"' : c.replace(/\t/g, ' '); }
  $('#a-pdf').addEventListener('click', function () { printReport('Vokabeltest „' + g.title + '“', summary + singles + flags + distHtml + hardHtml + gradeTable() + studentSheets(rows, g.title)); });
  $('#a-copy').addEventListener('click', function (e) { copyText(tableText('\t'), e.currentTarget); });
  $('#a-del').addEventListener('click', function () {
    if (!confirm('Alle ' + total + ' eingelesenen Ergebnisse zu „' + g.title + '“ aus diesem Browser löschen?')) return;
    lsSet(LS.results, store.filter(function (r) { return r.testId !== g.id; })); renderAnalysisTable();
  });
}

/* ===== Start ===== */
function boot() {
  APP = document.getElementById('app');
  stopPoll();
  var h = location.hash.replace(/^#/, '');
  if (h === 'a') { renderAnalysis(); return; }
  var params = new URLSearchParams(h);
  if (params.get('live')) { renderLive(params); return; }
  if (params.get('t') || params.get('k')) { bootStudent(params); return; }
  renderTeacher();
}
window.addEventListener('hashchange', function () { location.reload(); });
if (typeof window !== 'undefined') window.__vt = { cmpKennung: cmpKennung, sortRows: sortRows, sortName: sortName, guessIdm: guessIdm, studentSheets: studentSheets, gradeOf: gradeOf, gradeText: gradeText, parseList: parseList, parseRoster: parseRoster, gradeItem: gradeItem, gradeSubmission: gradeSubmission, norm: norm, lev: lev, median: median, b64uEncode: b64uEncode, b64uDecode: b64uDecode, extractResults: extractResults, validResult: validResult, cellOf: cellOf, safeCell: safeCell, IDM: IDM };
document.addEventListener('DOMContentLoaded', boot);
})();
</script>
